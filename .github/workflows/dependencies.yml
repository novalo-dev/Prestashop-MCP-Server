name: Dependencies

# Every three days, and on demand: is a newer version out of something the
# module ships or follows - Neuron AI, the other pinned libraries, the ALTCHA
# widget, the MCP specification, the official PHP SDK, PrestaShop itself - and does anything the
# module ships have a known vulnerability? Each opens an issue - one per
# version, never a duplicate - with what to read before moving. Nothing is
# upgraded here: a version moves in a commit, checked by the CI.
on:
  schedule:
    # Days 1, 4, 7... of the month: every 72 hours, except across the end of a
    # month, where cron has no notion of "three days after the last run".
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Newer Neuron AI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PINNED=$(php -r '$c = json_decode(file_get_contents("composer.json"), true); echo $c["require"]["neuron-core/neuron-ai"];')
          LATEST=$(curl -fsSL https://repo.packagist.org/p2/neuron-core/neuron-ai.json \
            | php -r '$d = json_decode(stream_get_contents(STDIN), true); foreach ($d["packages"]["neuron-core/neuron-ai"] as $p) { if (preg_match("/^v?\d+\.\d+\.\d+$/", $p["version"])) { echo ltrim($p["version"], "v"); break; } }')
          echo "Pinned $PINNED, latest $LATEST"
          echo "| Neuron AI | pinned $PINNED, latest $LATEST |" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -1)" = "$PINNED" ]; then
            exit 0
          fi
          TITLE="Neuron AI $LATEST is out (pinned: $PINNED)"
          if gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Issue already open for $LATEST"
            exit 0
          fi
          gh issue create --title "$TITLE" --label dependencies --body "Neuron AI runs the built-in assistant. Version **$LATEST** is published; the module pins **$PINNED** in \`composer.json\`.

          Before moving the pin:

          1. Read what changed: https://github.com/neuron-core/neuron-ai/releases and https://github.com/neuron-core/neuron-ai/compare/$PINNED...$LATEST
          2. Change the version in \`composer.json\`, then run \`composer install\` and \`php dev/package/contract.php .\` locally.
          3. Push: the CI **Dependencies** job checks the API the assistant calls and that the pruned archive still loads, and the shop tests run a conversation on every PrestaShop release.
          4. Look for new code that runs processes or shell commands, and add its folder to \`dev/package/prune.txt\` if the assistant does not need it." \
            || gh issue create --title "$TITLE" --body "Neuron AI $LATEST is published; the module pins $PINNED. See https://github.com/neuron-core/neuron-ai/releases"

      - name: Known vulnerabilities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          composer install --no-dev --no-interaction --no-progress
          if composer audit --no-dev --locked --format=plain > /tmp/audit.txt 2>&1; then
            echo "| Audit | no known vulnerability |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat /tmp/audit.txt
          TITLE="Security advisory on a dependency ($(date +%Y-%m-%d))"
          if gh issue list --state open --search "\"Security advisory on a dependency\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An advisory issue is already open"
          else
            gh issue create --title "$TITLE" --body "\`composer audit\` reports a known vulnerability in a dependency the module ships:

          \`\`\`
          $(head -c 5000 /tmp/audit.txt)
          \`\`\`"
          fi
          exit 1

      # The other libraries composer.json pins to one version. Neuron AI has
      # its own step above, with what its upgrade needs checked.
      - name: Newer pinned libraries
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true); foreach ($c["require"] as $n => $v) { if (strpos($n, "/") !== false && $n !== "neuron-core/neuron-ai" && preg_match("/^\d+\.\d+\.\d+$/", $v)) { echo "$n $v\n"; } }' > /tmp/pinned.txt
          while read -r NAME PINNED; do
            LATEST=$(curl -fsSL "https://repo.packagist.org/p2/$NAME.json" \
              | php -r '$d = json_decode(stream_get_contents(STDIN), true); foreach (reset($d["packages"]) as $p) { if (preg_match("/^v?\d+\.\d+\.\d+$/", $p["version"])) { echo ltrim($p["version"], "v"); break; } }')
            echo "| $NAME | pinned $PINNED, latest $LATEST |" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -1)" = "$PINNED" ]; then
              continue
            fi
            TITLE="$NAME $LATEST is out (pinned: $PINNED)"
            gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q . && continue
            gh issue create --title "$TITLE" --label dependencies --body "Version **$LATEST** of \`$NAME\` is published; the module pins **$PINNED** in \`composer.json\`. Read its changelog, change the version, run \`composer install\`, then push: the CI runs the attacks on the sign-in page and every tool on every PrestaShop release." \
              || gh issue create --title "$TITLE" --body "$NAME $LATEST is published; the module pins $PINNED."
          done < /tmp/pinned.txt

      # The ALTCHA widget is copied into views/js/altcha/ by hand, so Composer
      # neither updates it nor audits it: its version is read from the file,
      # its newer releases from npm and its advisories from GitHub's database.
      - name: ALTCHA widget
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHIPPED=$(grep -oE '"mounted","[0-9]+\.[0-9]+\.[0-9]+"' views/js/altcha/altcha.i18n.min.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LATEST=$(curl -fsSL https://registry.npmjs.org/altcha/latest | php -r 'echo json_decode(stream_get_contents(STDIN), true)["version"] ?? "";')
          echo "| ALTCHA widget | shipped $SHIPPED, latest $LATEST |" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SHIPPED" ]; then
            echo "::error::the version of views/js/altcha/altcha.i18n.min.js could not be read"; exit 1
          fi
          ADVISORIES=$(gh api "/advisories?ecosystem=npm&affects=altcha@$SHIPPED&per_page=100" --jq '.[] | "- \(.ghsa_id) (\(.severity)): \(.summary)"')
          if [ -n "$ADVISORIES" ]; then
            TITLE="Security advisory on the ALTCHA widget $SHIPPED"
            gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q . \
              || gh issue create --title "$TITLE" --label dependencies --body "The ALTCHA widget shipped in \`views/js/altcha/\` is $SHIPPED, and GitHub's advisory database lists:

          $ADVISORIES

          Replace the file with a fixed release from npm, keeping the licence header at its top." \
              || gh issue create --title "$TITLE" --body "$ADVISORIES"
          fi
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$SHIPPED" "$LATEST" | sort -V | tail -1)" != "$SHIPPED" ]; then
            TITLE="ALTCHA widget $LATEST is out (shipped: $SHIPPED)"
            gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q . \
              || gh issue create --title "$TITLE" --label dependencies --body "The widget shipped in \`views/js/altcha/\` is $SHIPPED; npm has $LATEST. Read https://github.com/altcha-org/altcha/releases, replace \`altcha.i18n.min.js\` with the new build, keep the licence header at its top, and check that the sign-in page still solves its challenge: the UI tests do it in a real browser." \
              || gh issue create --title "$TITLE" --body "ALTCHA widget $LATEST is out; the module ships $SHIPPED."
          fi

      # A new revision of the MCP specification can change the protocol or the
      # way assistants are authorized. The newest one the module speaks is
      # SomcpProtocol::LATEST; the specification repository has one folder per
      # revision under schema/.
      - name: MCP specification
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OURS=$(grep -oE "LATEST = '[0-9]{4}-[0-9]{2}-[0-9]{2}'" classes/SomcpProtocol.php | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          THEIRS=$(gh api repos/modelcontextprotocol/modelcontextprotocol/contents/schema --jq '.[].name' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)
          echo "| MCP specification | module $OURS, latest $THEIRS |" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$OURS" ] || [ -z "$THEIRS" ]; then
            echo "::error::a revision could not be read (module: '$OURS', specification: '$THEIRS')"; exit 1
          fi
          [ "$THEIRS" \> "$OURS" ] || exit 0
          TITLE="MCP specification $THEIRS is out (module speaks up to $OURS)"
          gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create --title "$TITLE" --label dependencies --body "A new revision of the Model Context Protocol, **$THEIRS**, is published; \`SomcpProtocol::LATEST\` is $OURS.

          1. Read the changelog of the revision: https://modelcontextprotocol.io/specification/$THEIRS/changelog
          2. Check what touches the transport (\`controllers/front/mcp.php\`), the protocol (\`classes/SomcpProtocol.php\`, \`classes/SomcpJsonRpc.php\`) and the authorization (\`classes/SomcpOAuthServer.php\`, \`classes/SomcpMetadata.php\`).
          3. Add the revision to what the module negotiates only once it follows it." \
            || gh issue create --title "$TITLE" --body "MCP specification $THEIRS is out; the module speaks up to $OURS."

      # The official PHP SDK (mcp/sdk) could replace the module's own protocol
      # layer, but only once it is stable: #199 waits for its 1.0 under the
      # waiting-release label. This step only says when that day comes.
      - name: Official MCP SDK
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STABLE=$(curl -fsSL https://repo.packagist.org/p2/mcp/sdk.json \
            | php -r '$d = json_decode(stream_get_contents(STDIN), true); foreach ($d["packages"]["mcp/sdk"] ?? [] as $p) { if (preg_match("/^v?[1-9]\d*\.\d+\.\d+$/", $p["version"])) { echo ltrim($p["version"], "v"); break; } }')
          echo "| mcp/sdk | first stable: ${STABLE:-none yet} |" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$STABLE" ] || exit 0
          TITLE="Official PHP MCP SDK $STABLE is out (#199 waits for it)"
          # One issue for the first stable release: later ones change nothing
          # for #199, which is then back in the drafts.
          gh issue list --state all --search "\"Official PHP MCP SDK\" in:title" --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create --title "$TITLE" --label dependencies --body "The official PHP SDK of the Model Context Protocol, \`mcp/sdk\`, has a stable release: **$STABLE**.

          #199 waits for it under the \`waiting-release\` label: it lists what the SDK would and would not replace, and the questions to answer now that the API is stable.

          1. Read the release notes: https://github.com/modelcontextprotocol/php-sdk/releases
          2. Put #199 back in the drafts, to be decided." \
            || gh issue create --title "$TITLE" --body "mcp/sdk $STABLE is out; #199 waits for it."

      # The Integration matrix lists PrestaShop releases by hand. A stable 8.x
      # or 9.x release missing from it is a release the module was never run on.
      - name: PrestaShop releases
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/PrestaShop/PrestaShop/releases?per_page=50' --jq '.[] | select(.prerelease | not) | .tag_name' \
            | grep -E '^(8|9)\.[0-9]+\.[0-9]+$' | sort -V > /tmp/released.txt
          grep -oE "prestashop: '[0-9]+\.[0-9]+\.[0-9]+'" .github/workflows/integration.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u > /tmp/tested.txt
          MISSING=$(comm -23 /tmp/released.txt /tmp/tested.txt | tr '\n' ' ')
          echo "| PrestaShop | not in the Integration matrix: ${MISSING:-none} |" >> "$GITHUB_STEP_SUMMARY"
          for V in $MISSING; do
            TITLE="PrestaShop $V is out and not tested"
            gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq '.[0].number' | grep -q . && continue
            gh issue create --title "$TITLE" --label dependencies --body "PrestaShop **$V** is published and missing from the matrix of \`.github/workflows/integration.yml\`. Add it with each PHP version it supports, and to \`ps_versions_compliancy\` if it is past the current maximum." \
              || gh issue create --title "$TITLE" --body "PrestaShop $V is out and not in the Integration matrix."
          done
