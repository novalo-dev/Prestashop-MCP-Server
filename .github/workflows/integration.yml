name: Integration

# The module installed and run on every published PrestaShop 8 and 9, with each
# PHP version that release supports, then attacked over HTTP and uninstalled.
on:
  push:
    branches: [main, develop]
  pull_request:
  # Build for Release runs this workflow on the commit it is about to publish,
  # and publishes only if every job passed.
  workflow_call:

permissions:
  contents: read

# The event is part of the group: the run a release calls must neither cancel
# nor be cancelled by the one a push to main started on the same branch.
concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shop:
    # Every tool called for real, then the uninstall checked, then PHPStan,
    # on each published PrestaShop 8 and 9 with each PHP version that release
    # supports. The other jobs read the code on its own; this one runs it
    # against a database and analyses it against that release's classes,
    # which is where a column PrestaShop 8.0 lacks or a method PrestaShop 9
    # removed actually shows up.
    #
    # Runs beside the PHP tests and the security checks rather than after
    # them, now that each has a workflow and a badge of its own.
    #
    # Only the pairs PrestaShop supports: PrestaShop 8 refuses PHP above 8.1,
    # and a failure there would say more about the core than about the
    # module.
    #
    # The pairs marked composer install the module the way an agency does,
    # with composer require from the shop's root, instead of from the zip:
    # the oldest PrestaShop 9, one in the middle and the newest, so a
    # dependency that no longer fits beside the core's own shows up there.
    # Only PrestaShop 9: the composer.lock of PrestaShop 8 holds core packages
    # that declare PHP 8.0 at most, so Composer refuses any package needing
    # 8.1 there whatever the platform says. PrestaShop 8 installs from the zip.
    name: PrestaShop ${{ matrix.prestashop }} on PHP ${{ matrix.php }}
    # Pinned: on the Ubuntu 26.04 image ubuntu-latest moved to, apt and the
    # shop install fail to resolve the archive and package hosts, which turns
    # every run red for a reason unrelated to the module.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { prestashop: '8.0.0', php: '8.1', attack: true }
          - { prestashop: '8.0.1', php: '8.1' }
          - { prestashop: '8.0.2', php: '8.1' }
          - { prestashop: '8.0.3', php: '8.1' }
          - { prestashop: '8.0.4', php: '8.1' }
          - { prestashop: '8.0.5', php: '8.1' }
          - { prestashop: '8.1.0', php: '8.1' }
          - { prestashop: '8.1.1', php: '8.1' }
          - { prestashop: '8.1.2', php: '8.1' }
          - { prestashop: '8.1.3', php: '8.1' }
          - { prestashop: '8.1.4', php: '8.1' }
          - { prestashop: '8.1.5', php: '8.1' }
          - { prestashop: '8.1.6', php: '8.1' }
          - { prestashop: '8.1.7', php: '8.1' }
          - { prestashop: '8.2.0', php: '8.1' }
          - { prestashop: '8.2.1', php: '8.1' }
          - { prestashop: '8.2.2', php: '8.1' }
          - { prestashop: '8.2.3', php: '8.1' }
          - { prestashop: '8.2.4', php: '8.1' }
          - { prestashop: '8.2.5', php: '8.1' }
          - { prestashop: '8.2.6', php: '8.1' }
          - { prestashop: '8.2.7', php: '8.1' }
          - { prestashop: '8.2.8', php: '8.1' }
          - { prestashop: '8.2.9', php: '8.1', attack: true }
          - { prestashop: '9.0.0', php: '8.1', composer: true }
          - { prestashop: '9.0.0', php: '8.2' }
          - { prestashop: '9.0.0', php: '8.3' }
          - { prestashop: '9.0.0', php: '8.4' }
          - { prestashop: '9.0.1', php: '8.1' }
          - { prestashop: '9.0.1', php: '8.2' }
          - { prestashop: '9.0.1', php: '8.3' }
          - { prestashop: '9.0.1', php: '8.4' }
          - { prestashop: '9.0.2', php: '8.1' }
          - { prestashop: '9.0.2', php: '8.2' }
          - { prestashop: '9.0.2', php: '8.3' }
          - { prestashop: '9.0.2', php: '8.4' }
          - { prestashop: '9.0.3', php: '8.1' }
          - { prestashop: '9.0.3', php: '8.2' }
          - { prestashop: '9.0.3', php: '8.3' }
          - { prestashop: '9.0.3', php: '8.4' }
          - { prestashop: '9.1.0', php: '8.1' }
          - { prestashop: '9.1.0', php: '8.2' }
          - { prestashop: '9.1.0', php: '8.3' }
          - { prestashop: '9.1.0', php: '8.4' }
          - { prestashop: '9.1.0', php: '8.5' }
          - { prestashop: '9.1.1', php: '8.1' }
          - { prestashop: '9.1.1', php: '8.2' }
          - { prestashop: '9.1.1', php: '8.3' }
          - { prestashop: '9.1.1', php: '8.4' }
          - { prestashop: '9.1.1', php: '8.5' }
          - { prestashop: '9.1.2', php: '8.1' }
          - { prestashop: '9.1.2', php: '8.2' }
          - { prestashop: '9.1.2', php: '8.3' }
          - { prestashop: '9.1.2', php: '8.4' }
          - { prestashop: '9.1.2', php: '8.5' }
          - { prestashop: '9.1.3', php: '8.1' }
          - { prestashop: '9.1.3', php: '8.2' }
          - { prestashop: '9.1.3', php: '8.3' }
          - { prestashop: '9.1.3', php: '8.4' }
          - { prestashop: '9.1.3', php: '8.5' }
          - { prestashop: '9.1.4', php: '8.1' }
          - { prestashop: '9.1.4', php: '8.2' }
          - { prestashop: '9.1.4', php: '8.3' }
          - { prestashop: '9.1.4', php: '8.4' }
          - { prestashop: '9.1.4', php: '8.5' }
          - { prestashop: '9.1.5', php: '8.1' }
          - { prestashop: '9.1.5', php: '8.2' }
          - { prestashop: '9.1.5', php: '8.3', composer: true }
          - { prestashop: '9.1.5', php: '8.4' }
          - { prestashop: '9.1.5', php: '8.5' }
          - { prestashop: '9.2.0', php: '8.1' }
          - { prestashop: '9.2.0', php: '8.2' }
          - { prestashop: '9.2.0', php: '8.3' }
          - { prestashop: '9.2.0', php: '8.4' }
          - { prestashop: '9.2.0', php: '8.5' }
          - { prestashop: '9.2.1', php: '8.1' }
          - { prestashop: '9.2.1', php: '8.2' }
          - { prestashop: '9.2.1', php: '8.3' }
          - { prestashop: '9.2.1', php: '8.4', composer: true }
          - { prestashop: '9.2.1', php: '8.5', attack: true }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prestashop
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          path: module
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, pdo_mysql, curl, xml, dom, simplexml, fileinfo, iconv, bcmath, openssl
          ini-values: memory_limit=1G
          coverage: none
          tools: composer
      # PrestaShop 9 is published as a zip only behind a form on
      # prestashop.com, so every version is built the same way from its tag:
      # the sources, then the dependencies from the tag's own composer.lock.
      - name: PrestaShop ${{ matrix.prestashop }} sources
        run: git clone --quiet --depth 1 --branch "${{ matrix.prestashop }}" https://github.com/PrestaShop/PrestaShop.git shop
      # One cache per PrestaShop version, shared by its PHP versions: the
      # packages downloaded depend on the lock file only, and a key per PHP
      # version stored the same files up to five times, past GitHub's 10 GB.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.prestashop }}-${{ hashFiles('shop/composer.lock') }}
      - name: Dependencies
        id: deps
        working-directory: shop
        run: composer install --no-interaction --no-progress --prefer-dist
      # The themes come from Composer as sources, without the built
      # assets the installer insists on finding. Nothing here renders the
      # storefront, so empty files are enough to let the install through.
      - name: Theme assets the installer checks for
        working-directory: shop
        run: |
          for theme in themes/*/; do
            [ -f "$theme/config/theme.yml" ] || continue
            mkdir -p "$theme/assets/js" "$theme/assets/css"
            [ -f "$theme/assets/js/theme.js" ] || touch "$theme/assets/js/theme.js"
            [ -f "$theme/assets/css/theme.css" ] || touch "$theme/assets/css/theme.css"
          done
      - name: Install the shop with its demo data
        working-directory: shop
        run: |
          # The installer downloads the currency feed from api.prestashop.com
          # and aborts when that host does not answer, which fails one pair
          # out of the matrix for a reason unrelated to the module. It drops
          # its own tables before starting (db_clear), so a second attempt
          # starts clean.
          # Logs are not readable from outside the run, so the end of a failed
          # install is repeated as one annotation, where the summary shows it.
          set -o pipefail
          for attempt in 1 2 3; do
            php -d memory_limit=1G install-dev/index_cli.php \
              --domain=localhost --db_server=127.0.0.1 --db_user=root --db_password=root \
              --db_name=prestashop --prefix=ps_ --language=en --country=fr --ssl=0 --fixtures=1 \
              --email=demo@example.com --password=Somcp-shop-test-1 2>&1 | tee ../install.log \
              && exit 0
            echo "Install attempt $attempt failed"
            # The failed attempt may have compiled the Symfony container
            # before the native modules were installed; reused by the next
            # attempt, it lacks their services and the module install then
            # fails on one of them.
            rm -rf var/cache/*
            sleep 15
          done
          echo "::error title=Install failed::$(tail -n 40 ../install.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
      - name: Install somcp
        id: install
        run: |
          set -o pipefail
          if [ "${{ matrix.composer }}" = "true" ]; then
            # The package as Packagist hands it out: GitHub builds its zip with
            # git archive, so export-ignore applies there too. composer/installers
            # puts a prestashop-module in modules/<installer-name>, and the
            # module's dependencies join the shop's own vendor/, resolved
            # against the versions the core has locked - a conflict fails here.
            mkdir package
            git -C module archive HEAD | tar -x -C package
            composer config --working-dir=shop repositories.somcp '{"type": "path", "url": "../package", "options": {"symlink": false}}'
            composer config --working-dir=shop --no-plugins allow-plugins.composer/installers true
            composer require --working-dir=shop --no-interaction --no-progress 'novalo/prestashop-mcp-server:*@dev' 2>&1 | tee composer.log \
              || { echo "::error title=composer require failed::$(tail -n 40 composer.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
            [ -f shop/modules/somcp/somcp.php ] \
              || { echo "::error title=Wrong folder::composer did not install the module in modules/somcp"; exit 1; }
            # vendor/novalo holds the search library the module requires; the
            # module itself must not be there.
            [ ! -e shop/vendor/novalo/prestashop-mcp-server ] \
              || { echo "::error title=Wrong folder::composer put the module in vendor/ instead of modules/somcp"; exit 1; }
          else
            # The module as a merchant receives it: git archive leaves out what
            # export-ignore keeps out of the package.
            mkdir shop/modules/somcp
            git -C module archive HEAD | tar -x -C shop/modules/somcp
            # The builds add vendor/ the same way. Not pruned here: the test of
            # the assistant drives it with Neuron AI's own fake provider, which
            # the archive leaves out. The dependency job checks the pruned copy.
            composer install --working-dir=shop/modules/somcp --no-dev --no-interaction --no-progress --optimize-autoloader
          fi
          php shop/bin/console prestashop:module install somcp 2>&1 | tee module.log \
            || { echo "::error title=Module install failed::$(tail -n 40 module.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Call every tool
        run: php module/dev/shop-tests/run.php shop
      # On three releases - the oldest, the last PrestaShop 8 and the newest -
      # the shop is also served over HTTP and its addresses attacked: first the
      # refusals the module promises, then ZAP for what no test was written
      # for. The other pairs run the same controllers; three keep the run short
      # while crossing both major versions. Runs even when a tool call failed
      # above, so a run reports both kinds of problem at once.
      - name: Serve the shop
        id: serve
        if: ${{ !cancelled() && matrix.attack && steps.install.outcome == 'success' }}
        run: |
          # The shop was installed for http://localhost: serving it on port 80
          # keeps that address, so no domain is rewritten in the database.
          sudo setcap cap_net_bind_service=+ep "$(readlink -f "$(command -v php)")"
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:80 -t shop > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost/ && exit 0
            sleep 1
          done
          echo "::error title=Shop not served::$(tail -n 20 server.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
      - name: Attack the module's addresses
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        run: php module/dev/shop-tests/attacks.php shop http://localhost zap-token
      - name: ZAP active scan
        if: ${{ !cancelled() && steps.serve.outcome == 'success' }}
        env:
          ZAP_VERSION: '2.17.0'
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host \
            -v "$PWD/module/dev/security:/zap/plan:ro" -v "$PWD/zap:/zap/wrk" \
            -e SHOP_URL=http://localhost -e ZAP_TOKEN="$(cat zap-token)" -e ZAP_CLIENT="$(cat zap-token-client)" -e REPORT_DIR=/zap/wrk \
            "ghcr.io/zaproxy/zaproxy:$ZAP_VERSION" zap.sh -cmd -autorun /zap/plan/zap.yaml
          php module/dev/security/zap-verdict.php zap/zap-report.json
      # After the tools have run, so the shop holds everything the module
      # creates while it is used: a merchant who removes it must get the shop
      # back as it was. Runs even when a tool call failed above.
      - name: Uninstall leaves nothing behind
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          php shop/bin/console prestashop:module uninstall somcp 2>&1 | tee uninstall.log \
            || { echo "::error title=Module uninstall failed::$(tail -n 40 uninstall.log | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          php module/dev/shop-tests/uninstalled.php shop
      # The same PrestaShop sources, so each release is analysed against its
      # own classes; PHPStan targets the PHP it runs on, so each pair is a
      # different analysis. It runs even when a tool call failed above, so a
      # run reports both kinds of problem at once.
      - name: Install dev tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: composer install --working-dir=module/dev/tools --no-interaction --no-progress
      - name: Module dependencies for PHPStan
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: composer install --working-dir=module --no-dev --no-interaction --no-progress
      - name: PHPStan
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: module
        env:
          _PS_ROOT_DIR_: ${{ github.workspace }}/shop
        run: php -d memory_limit=1G dev/tools/vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --error-format=github

  passed:
    # The one name the main branch ruleset requires from this workflow. The
    # matrix names change with every PrestaShop release added or dropped, and
    # a required name no job reports any more blocks every merge for good.
    # always(): skipped would count as passing, so a cancelled or failed shop
    # job has to be read here and turned into a failure.
    name: Integration passed
    needs: shop
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every PrestaShop and PHP pair green
        run: |
          echo "shop jobs: ${{ needs.shop.result }}"
          [ "${{ needs.shop.result }}" = success ]
