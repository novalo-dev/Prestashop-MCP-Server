name: PHP tests

# The code read on its own: syntax, coding standard, static analysis against
# PrestaShop 8 and 9, translations, tools and prompts, multistore, container.
on:
  push:
    branches: [main, develop]
  pull_request:
  # Build for Release runs this workflow on the commit it is about to publish,
  # and publishes only if every job passed.
  workflow_call:

permissions:
  contents: read

# The event is part of the group: the run a release calls must neither cancel
# nor be cancelled by the one a push to main started on the same branch.
concurrency:
  group: php-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every PHP file
        run: |
          find . -name '*.php' -not -path './dev/tools/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -d display_errors=stderr -l > /dev/null

  coding-standard:
    name: PrestaShop coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr
      - name: Install dev tools
        run: composer install --working-dir=dev/tools --no-interaction --no-progress
      - name: php-cs-fixer
        # cs2pr turns each finding into an annotation on the file and line.
        run: dev/tools/vendor/bin/php-cs-fixer fix --dry-run --using-cache=no --format=checkstyle | cs2pr

  phpstan:
    # Kept beside the analysis in the shop job, which covers every release:
    # these two names are required checks of the main branch ruleset, and a
    # required check that never reports blocks every merge.
    name: PHPStan on PrestaShop ${{ matrix.prestashop }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Official images with PHP 8.1, the lowest version the module supports.
        # The PrestaShop files are already in /var/www/html in these images.
        prestashop: ['8.0.0-8.1', '9.0-8.1']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Install dev tools
        run: composer install --working-dir=dev/tools --no-interaction --no-progress
      # The module's own dependencies, which PHPStan reads to check the calls
      # the built-in assistant makes to Neuron AI.
      - name: Install the module dependencies
        run: composer install --no-dev --no-interaction --no-progress
      - name: Analyse inside the PrestaShop image
        run: |
          docker run --rm \
            -v "$PWD:/var/www/html/modules/somcp" \
            -w /var/www/html/modules/somcp \
            -e _PS_ROOT_DIR_=/var/www/html \
            --entrypoint php \
            prestashop/prestashop:${{ matrix.prestashop }} \
            -d memory_limit=1G \
            dev/tools/vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress --error-format=github

  translations:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Every visible string in all four catalogues
        run: php .github/scripts/check-translations.php .
      - name: Catalogues match dev/translations.py
        # A hand edit of an XLF file, or a table change committed without its
        # regenerated files, shows up here as a diff.
        run: |
          python3 dev/translations.py > /dev/null
          git diff --exit-code -- translations

  tools:
    name: Tools and prompts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Every tool documented, scoped and in a prompt
        run: php .github/scripts/check-tools.php .
      - name: Every source file with the module's licence header
        # Reported, never fixed here: a bot commit would be unsigned, and a
        # pull request from a fork cannot be written to. The message gives
        # the command that fixes it locally.
        run: php .github/scripts/check-headers.php .
      - name: An index.php in every module folder
        # The Addons validator refuses a package with a folder that lacks one.
        # The release build checks its zip too, but only once it is too late:
        # here a new folder is caught in the pull request that adds it.
        run: |
          MISSING=$(find classes config controllers mails prompts sql src tools translations upgrade views -type d ! -exec test -e '{}/index.php' ';' -print)
          if [ -n "$MISSING" ]; then
            echo "$MISSING" | sed 's/^/::error::index.php missing in /'
            exit 1
          fi
      - name: Nothing loaded from outside the shop
        # Every script, style sheet, font and image the module's pages and
        # e-mails use is shipped in the module: a file fetched from another
        # site runs with the page, the sign-in form included, and tells that
        # site who opened it. Links a person clicks are not concerned.
        run: |
          pattern="(<script[^>]*src=[\"']?|<link[^>]*href=[\"']?|@import[[:space:]]+(url\()?[\"']?|url\([[:space:]]*[\"']?)(https?:)?//"
          if grep -rnE "$pattern" views/ mails/ --include=*.tpl --include=*.css --include=*.js --include=*.html; then
            echo "::error::A file above loads a resource from outside the shop. Ship it in the module instead."
            exit 1
          fi

  multishop:
    name: Multistore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: none
      - name: Every table shop-scoped, no merchant setting stored globally
        run: php .github/scripts/check-multishop.php .
      # A column placed AFTER another fails the upgrade on a shop that lacks
      # that other one. New columns go in install.sql only: installDatabase()
      # adds them on every upgrade.
      - name: No upgrade column placed after another
        run: "! grep -rn 'AFTER `' upgrade/"

  container:
    name: Symfony container on Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - symfony: '4.4'  # PrestaShop 8
          - symfony: '6.4'  # PrestaShop 9
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Install the Symfony components PrestaShop uses
        run: |
          mkdir -p "$RUNNER_TEMP/sf"
          cd "$RUNNER_TEMP/sf"
          # Symfony 4.4 is end of life and carries security advisories, which
          # Composer refuses by default. Nothing here runs a request: the
          # components only parse and compile two configuration files.
          echo '{"config": {"audit": {"block-insecure": false}}}' > composer.json
          COMPOSER_NO_SECURITY_BLOCKING=1 composer require --no-interaction --no-progress \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/config:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }} \
            symfony/routing:^${{ matrix.symfony }} \
            symfony/http-foundation:^${{ matrix.symfony }}
      # The module's own autoloader, which the script loads: Composer writes
      # it, as the builds do for the archive.
      - name: Module dependencies
        run: composer install --no-dev --no-interaction --no-progress
      - name: Compile services.yml and resolve routes.yml
        run: php .github/scripts/compile-container.php "$RUNNER_TEMP/sf/vendor" .
