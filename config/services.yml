# O'So MCP Server - Novalo
#
# PrestaShop loads this file for every active module (AppKernel), so the Symfony
# classes of the module become services the router can reach. The one here is
# an entry point: a route PrestaShop authenticates natively, which then forwards
# to the legacy page with the tokens that page requires.
#
# Nothing is autowired, on purpose. This file is compiled on PrestaShop 8 too,
# where the routes are never used, and a constructor asking for a class that
# only PrestaShop 9 has stopped Symfony from building its container there: the
# whole back office answered 500. The controllers take nothing and look up
# what they need when they run.
services:
  Novalo\Somcp\Controller\UploadEntryController:
    class: Novalo\Somcp\Controller\UploadEntryController
    public: true
  Novalo\Somcp\Controller\DownloadEntryController:
    class: Novalo\Somcp\Controller\DownloadEntryController
    public: true
